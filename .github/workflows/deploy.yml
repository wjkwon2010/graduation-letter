name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 파일 검사
        run: |
          python3 -m json.tool data/public-config.json > /dev/null
          python3 -m json.tool data/encrypted-messages.json > /dev/null
          for f in js/*.js; do node --check --input-type=module < "$f"; done
          if [ -e data/students.json ] || [ -e data/messages.json ]; then
            echo "원본 데이터 파일이 Public 저장소에 있습니다."; exit 1
          fi
      - name: 배포할 파일만 모으기
        run: |
          mkdir _site
          cp -r *.html css js data assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
